<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player - Nexo Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .music-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(10px);
        }
        .music-header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 40px;
        }
        .music-player {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .now-playing {
            text-align: center;
            margin-bottom: 30px;
        }
        .album-art {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 15px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .track-info {
            margin-bottom: 20px;
        }
        .track-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .track-artist {
            font-size: 16px;
            opacity: 0.8;
        }
        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }
        .play-btn {
            width: 70px;
            height: 70px;
            font-size: 24px;
            background: rgba(255,255,255,0.3);
        }
        .progress-container {
            margin-bottom: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            width: 30%;
            transition: width 0.1s;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 14px;
            opacity: 0.8;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .volume-slider {
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
        }
        .volume-level {
            height: 100%;
            background: white;
            width: 70%;
            border-radius: 2px;
        }
        .playlist-section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .playlist-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .action-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .playlist-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }
        .tab {
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .tab.active {
            border-bottom-color: white;
        }
        .playlist-content {
            max-height: 400px;
            overflow-y: auto;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 5px;
        }
        .track-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .track-item.active {
            background: rgba(255,255,255,0.2);
        }
        .track-number {
            width: 30px;
            text-align: center;
            opacity: 0.7;
        }
        .track-art {
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 8px;
            margin: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .track-details {
            flex: 1;
        }
        .track-name {
            font-weight: bold;
            margin-bottom: 3px;
        }
        .track-meta {
            font-size: 14px;
            opacity: 0.7;
        }
        .track-duration {
            opacity: 0.7;
        }
        .track-actions {
            display: flex;
            gap: 10px;
            margin-left: 15px;
        }
        .track-action-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .track-action-btn:hover {
            opacity: 1;
        }
        .upload-section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }
        .upload-area {
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.05);
        }
        .upload-area.dragover {
            border-color: white;
            background: rgba(255,255,255,0.1);
        }
        .file-input {
            display: none;
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn">←</a>
    <div class="music-container">
        <div class="music-header">
            <h1>🎵 Music Player</h1>
            <p>Ваша музыка, ваш плейлист, ваше настроение</p>
        </div>

        <div class="music-player">
            <div class="now-playing">
                <div class="album-art">🎵</div>
                <div class="track-info">
                    <div class="track-title" id="currentTitle">Выберите трек</div>
                    <div class="track-artist" id="currentArtist">Исполнитель</div>
                </div>
            </div>

            <div class="player-controls">
                <button class="control-btn" onclick="previousTrack()">⏮</button>
                <button class="control-btn" onclick="toggleShuffle()" id="shuffleBtn">🔀</button>
                <button class="control-btn play-btn" onclick="togglePlay()" id="playBtn">▶</button>
                <button class="control-btn" onclick="toggleRepeat()" id="repeatBtn">🔁</button>
                <button class="control-btn" onclick="nextTrack()">⏭</button>
            </div>

            <div class="progress-container">
                <div class="progress-bar" onclick="seekTo(event)">
                    <div class="progress" id="progressBar"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="volume-control">
                <span>🔊</span>
                <div class="volume-slider" onclick="setVolume(event)">
                    <div class="volume-level" id="volumeLevel"></div>
                </div>
                <span id="volumePercent">70%</span>
            </div>
        </div>

        <div class="playlist-section">
            <div class="playlist-header">
                <h2>Плейлисты</h2>
                <div class="playlist-actions">
                    <button class="action-btn" onclick="createPlaylist()">+ Создать</button>
                    <button class="action-btn" onclick="importPlaylist()">📥 Импорт</button>
                    <button class="action-btn" onclick="exportPlaylist()">📤 Экспорт</button>
                </div>
            </div>

            <div class="playlist-tabs">
                <div class="tab active" onclick="switchTab('liked', this)">❤️ Понравившиеся</div>
                <div class="tab" onclick="switchTab('my', this)">📂 Мои плейлисты</div>
                <div class="tab" onclick="switchTab('shared', this)">🔗 Поделиться</div>
            </div>

            <div class="playlist-content" id="playlistContent">
                <!-- Треки будут добавлены через JavaScript -->
            </div>
        </div>

        <div class="upload-section">
            <h2>Загрузить музыку</h2>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                <div>📁</div>
                <p>Перетащите файлы сюда или нажмите для выбора</p>
                <p style="font-size: 14px; opacity: 0.7;">Поддерживаемые форматы: MP3, WAV, FLAC, M4A</p>
            </div>
            <input type="file" id="fileInput" class="file-input" multiple accept="audio/*" onchange="handleFileSelect(event)">
        </div>
    </div>

    <script>
        // Мок данные для демонстрации
        const mockTracks = [
            { id: 1, title: "Bohemian Rhapsody", artist: "Queen", duration: "5:55", liked: true },
            { id: 2, title: "Stairway to Heaven", artist: "Led Zeppelin", duration: "8:02", liked: true },
            { id: 3, title: "Hotel California", artist: "Eagles", duration: "6:30", liked: false },
            { id: 4, title: "Sweet Child O' Mine", artist: "Guns N' Roses", duration: "5:56", liked: true },
            { id: 5, title: "Smells Like Teen Spirit", artist: "Nirvana", duration: "5:01", liked: false },
            { id: 6, title: "Imagine", artist: "John Lennon", duration: "3:03", liked: true },
            { id: 7, title: "Hey Jude", artist: "The Beatles", duration: "7:11", liked: true },
            { id: 8, title: "Like a Rolling Stone", artist: "Bob Dylan", duration: "6:13", liked: false }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let currentTab = 'liked';
        let progress = 0;
        let volume = 0.7;
        let isRepeat = false;
        let isShuffle = false;

        function renderPlaylist() {
            const content = document.getElementById('playlistContent');
            let tracks = mockTracks;

            if (currentTab === 'liked') {
                tracks = tracks.filter(track => track.liked);
            }

            content.innerHTML = tracks.map((track, index) => `
                <div class="track-item ${index === currentTrackIndex ? 'active' : ''}" onclick="selectTrack(${index})">
                    <div class="track-number">${index + 1}</div>
                    <div class="track-art">🎵</div>
                    <div class="track-details">
                        <div class="track-name">${track.title}</div>
                        <div class="track-meta">${track.artist}</div>
                    </div>
                    <div class="track-duration">${track.duration}</div>
                    <div class="track-actions">
                        <button class="track-action-btn" onclick="toggleLike(event, ${track.id})">${track.liked ? '❤️' : '🤍'}</button>
                        <button class="track-action-btn" onclick="shareTrack(event, ${track.id})">🔗</button>
                    </div>
                </div>
            `).join('');
        }

        function selectTrack(index) {
            currentTrackIndex = index;
            updateNowPlaying();
            renderPlaylist();
            if (isPlaying) {
                play();
            }
        }

        function updateNowPlaying() {
            const track = mockTracks[currentTrackIndex];
            document.getElementById('currentTitle').textContent = track.title;
            document.getElementById('currentArtist').textContent = track.artist;
            document.getElementById('totalTime').textContent = track.duration;
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
            
            if (isPlaying) {
                simulatePlayback();
            }
        }

        function simulatePlayback() {
            if (!isPlaying) return;
            
            progress += 1;
            if (progress > 100) {
                if (isRepeat) {
                    progress = 0;
                } else {
                    nextTrack();
                    return;
                }
            }
            
            document.getElementById('progressBar').style.width = progress + '%';
            
            // Обновление времени
            const currentSeconds = Math.floor((progress / 100) * 355); // 5:55 в секундах
            const minutes = Math.floor(currentSeconds / 60);
            const seconds = currentSeconds % 60;
            document.getElementById('currentTime').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            setTimeout(simulatePlayback, 1000);
        }

        function previousTrack() {
            currentTrackIndex = currentTrackIndex > 0 ? currentTrackIndex - 1 : mockTracks.length - 1;
            progress = 0;
            updateNowPlaying();
            renderPlaylist();
        }

        function nextTrack() {
            if (isShuffle) {
                currentTrackIndex = Math.floor(Math.random() * mockTracks.length);
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % mockTracks.length;
            }
            progress = 0;
            updateNowPlaying();
            renderPlaylist();
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeatBtn').style.opacity = isRepeat ? '1' : '0.7';
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').style.opacity = isShuffle ? '1' : '0.7';
        }

        function seekTo(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left;
            progress = (x / rect.width) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function setVolume(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left;
            volume = Math.max(0, Math.min(1, x / rect.width));
            document.getElementById('volumeLevel').style.width = (volume * 100) + '%';
            document.getElementById('volumePercent').textContent = Math.round(volume * 100) + '%';
        }

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            renderPlaylist();
        }

        function toggleLike(event, trackId) {
            event.stopPropagation();
            const track = mockTracks.find(t => t.id === trackId);
            if (track) {
                track.liked = !track.liked;
                renderPlaylist();
            }
        }

        function shareTrack(event, trackId) {
            event.stopPropagation();
            alert(`Функция поделиться треком #${trackId} пока не реализована. В реальности здесь будет интеграция с мессенджером.`);
        }

        function createPlaylist() {
            const name = prompt('Введите название плейлиста:');
            if (name) {
                alert(`Плейлист "${name}" создан! В реальности он будет добавлен в список ваших плейлистов.`);
            }
        }

        function importPlaylist() {
            alert('Функция импорта плейлиста пока не реализована. В реальности здесь будет загрузка файла плейлиста.');
        }

        function exportPlaylist() {
            alert('Функция экспорта плейлиста пока не реализована. В реальности здесь будет скачивание файла плейлиста.');
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            console.log('Выбраны файлы:', files);
            alert(`Выбрано ${files.length} файлов. В реальности они будут загружены и добавлены в вашу библиотеку.`);
        }

        function handleDrop(event) {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.remove('dragover');
            
            const files = event.dataTransfer.files;
            console.log('Перетащены файлы:', files);
            alert(`Перетащено ${files.length} файлов. В реальности они будут загружены и добавлены в вашу библиотеку.`);
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(event) {
            event.currentTarget.classList.remove('dragover');
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            renderPlaylist();
            updateNowPlaying();
            
            // Установка начальной громкости
            document.getElementById('volumeLevel').style.width = '70%';
        });

        // Фоновое воспроизведение (заглушка)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && isPlaying) {
                console.log('Приложение в фоне, музыка продолжает играть');
                // В реальности здесь будет интеграция с Web Audio API или Service Worker
            }
        });
    </script>
</body>
</html>
